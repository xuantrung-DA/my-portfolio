<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("portfolio-theme");
          const theme = savedTheme === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    
    <!-- SEO -->
    <title>Nguyen Xuan Trung — AI Engineer</title>
    <meta name="description" content="AI engineering portfolio of Nguyen Xuan Trung — production-minded work across computer vision, agentic AI, edge inference, backend systems, and applied research." />
    <meta name="keywords" content="Nguyen Xuan Trung, AI Engineer, Applied AI, Computer Vision, Agentic AI, Edge AI, MLOps" />
    <meta name="author" content="Nguyễn Xuân Trung" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Nguyen Xuan Trung — AI Engineer" />
    <meta property="og:description" content="Production-minded AI systems, applied research, and measurable engineering outcomes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/hero/ai-systems-hero-v1-1920.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Theme color -->
    <meta name="theme-color" content="#06152f" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
