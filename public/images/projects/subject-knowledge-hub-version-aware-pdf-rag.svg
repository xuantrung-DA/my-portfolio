<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="640" viewBox="0 0 1800 640" role="img" aria-labelledby="title description">
  <title id="title">Subject Knowledge Hub version-aware PDF RAG architecture</title>
  <desc id="description">Authenticated PDF uploads create durable ingestion jobs processed by Celery into a versioned PostgreSQL and pgvector index. Subject-scoped retrieval supplies bounded OpenAI responses with citations to exact document versions and physical pages.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7a1328" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#f6ecdc"/>
    </linearGradient>
    <linearGradient id="ai-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e4d6"/>
      <stop offset="1" stop-color="#eed8c8"/>
    </linearGradient>
    <linearGradient id="answer-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f1732"/>
      <stop offset="1" stop-color="#650d21"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#725f52"/>
    </marker>
    <marker id="arrow-wine" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a1328"/>
    </marker>
  </defs>

  <rect width="1800" height="640" fill="#ffffff"/>
  <rect width="1800" height="640" fill="url(#grid)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="35" fill="#7a1328" font-family="Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.3">01 / INGEST &amp; VERSION</text>

    <g>
      <rect x="40" y="58" width="245" height="172" rx="18" fill="url(#panel)" stroke="#cdb894" stroke-width="1.5"/>
      <rect x="62" y="78" width="71" height="24" rx="12" fill="#7a1328" fill-opacity="0.08"/>
      <text x="77" y="95" fill="#7a1328" font-family="Consolas, monospace" font-size="11" font-weight="700">UPLOAD</text>
      <text x="62" y="137" fill="#281f1a" font-size="25" font-weight="750">PDF source</text>
      <text x="62" y="173" fill="#66564b" font-size="17">Text-bearing PDFs</text>
      <text x="62" y="204" fill="#725f52" font-family="Consolas, monospace" font-size="12">DOCUMENT VERSIONS</text>
    </g>

    <path d="M 285 144 H 318" fill="none" stroke="#725f52" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="330" y="58" width="390" height="172" rx="18" fill="url(#panel)" stroke="#cdb894" stroke-width="1.5"/>
      <text x="355" y="108" fill="#281f1a" font-size="25" font-weight="750">FastAPI admission</text>
      <text x="355" y="151" fill="#66564b" font-size="18">Auth · scope · deduplication</text>
      <text x="355" y="187" fill="#725f52" font-size="15">Commit durable job before enqueue</text>
      <rect x="355" y="201" width="152" height="8" rx="4" fill="#7a1328" fill-opacity="0.18"/>
    </g>

    <text x="742" y="126" fill="#7a1328" font-family="Consolas, monospace" font-size="12" font-weight="700">REDIS</text>
    <path d="M 720 144 H 783" fill="none" stroke="#725f52" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="795" y="58" width="440" height="172" rx="18" fill="url(#panel)" stroke="#cdb894" stroke-width="1.5"/>
      <text x="822" y="108" fill="#281f1a" font-size="25" font-weight="750">Resumable Celery ingestion</text>
      <text x="822" y="151" fill="#66564b" font-size="18">Parse → page chunks → embeddings</text>
      <text x="822" y="187" fill="#725f52" font-size="15">PostgreSQL checkpoints · advisory locks</text>
      <g transform="translate(822 201)">
        <rect width="96" height="8" rx="4" fill="#7a1328"/>
        <rect x="104" width="96" height="8" rx="4" fill="#b77987"/>
        <rect x="208" width="96" height="8" rx="4" fill="#d7b9a0"/>
      </g>
    </g>

    <path d="M 1235 144 H 1298" fill="none" stroke="#725f52" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="1310" y="58" width="450" height="172" rx="18" fill="#fffaf1" stroke="#7a1328" stroke-opacity="0.65" stroke-width="1.5"/>
      <text x="1338" y="108" fill="#281f1a" font-size="25" font-weight="750">Versioned knowledge index</text>
      <text x="1338" y="151" fill="#66564b" font-size="18">PostgreSQL + pgvector</text>
      <text x="1338" y="187" fill="#725f52" font-size="15">Activate only fully embedded versions</text>
      <rect x="1590" y="82" width="140" height="30" rx="15" fill="#7a1328" fill-opacity="0.08"/>
      <text x="1612" y="102" fill="#7a1328" font-family="Consolas, monospace" font-size="11" font-weight="700">ACTIVE STATE</text>
    </g>

    <path d="M 1535 230 V 276 H 525 V 330" fill="none" stroke="#725f52" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="40" y="318" fill="#7a1328" font-family="Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.3">02 / RETRIEVE &amp; ANSWER</text>

    <g>
      <rect x="40" y="342" width="245" height="178" rx="18" fill="#fffaf1" stroke="#cdb894" stroke-width="1.5"/>
      <text x="62" y="391" fill="#281f1a" font-size="25" font-weight="750">User question</text>
      <text x="62" y="431" fill="#66564b" font-size="18">Vietnamese / English</text>
      <text x="62" y="468" fill="#725f52" font-size="15">Authenticated React UI</text>
      <text x="62" y="496" fill="#7a1328" font-family="Consolas, monospace" font-size="11" font-weight="700">SUBJECT CONTEXT</text>
    </g>

    <path d="M 285 431 H 318" fill="none" stroke="#725f52" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="330" y="342" width="390" height="178" rx="18" fill="#fffaf1" stroke="#cdb894" stroke-width="1.5"/>
      <text x="355" y="391" fill="#281f1a" font-size="25" font-weight="750">Scoped retrieval</text>
      <text x="355" y="431" fill="#66564b" font-size="18">Owner · subject · active version</text>
      <text x="355" y="468" fill="#725f52" font-size="15">Filter first, then rank and cap context</text>
      <text x="355" y="496" fill="#4f6788" font-family="Consolas, monospace" font-size="11" font-weight="700">DENSE · LEXICAL · HYBRID</text>
    </g>

    <path d="M 720 431 H 783" fill="none" stroke="#725f52" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="795" y="342" width="440" height="178" rx="18" fill="url(#ai-panel)" stroke="#b98f70" stroke-width="1.5"/>
      <text x="822" y="391" fill="#281f1a" font-size="25" font-weight="750">OpenAI Responses</text>
      <text x="822" y="431" fill="#66564b" font-size="18">Direct RAG or bounded document tools</text>
      <text x="822" y="468" fill="#725f52" font-size="15">Token budgets · retries · usage accounting</text>
      <rect x="822" y="487" width="150" height="8" rx="4" fill="#7a1328" fill-opacity="0.7"/>
      <rect x="980" y="487" width="104" height="8" rx="4" fill="#b77987" fill-opacity="0.75"/>
    </g>

    <path d="M 1235 431 H 1298" fill="none" stroke="#7a1328" stroke-width="2.2" marker-end="url(#arrow-wine)"/>

    <g>
      <rect x="1310" y="342" width="450" height="178" rx="18" fill="url(#answer-panel)" stroke="#7a1328" stroke-width="1.5"/>
      <text x="1338" y="391" fill="#fffaf1" font-size="25" font-weight="750">Answer + source page</text>
      <text x="1338" y="431" fill="#f4dfe3" font-size="18">Version-specific PDF citations</text>
      <text x="1338" y="468" fill="#e8bdc7" font-size="15">Open the supporting physical page</text>
      <g transform="translate(1338 487)">
        <circle cx="5" cy="4" r="5" fill="#fffaf1"/>
        <rect x="20" width="174" height="8" rx="4" fill="#fffaf1" fill-opacity="0.34"/>
      </g>
    </g>

    <line x1="40" y1="565" x2="1760" y2="565" stroke="#cdb894" stroke-width="1.5"/>
    <text x="40" y="604" fill="#7a1328" font-family="Consolas, monospace" font-size="14" font-weight="700">DOCUMENT LIFECYCLE</text>
    <text x="245" y="604" fill="#66564b" font-size="16">Failed replacements preserve the previous active version; historical citations retain their original source.</text>
  </g>
</svg>
