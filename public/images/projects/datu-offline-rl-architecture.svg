<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="640" viewBox="0 0 1800 640" role="img" aria-labelledby="title description">
  <title id="title">DATU offline reinforcement learning evaluation architecture</title>
  <desc id="description">Matched PointMaze trajectories are scored by a fixed IQL reference ensemble and three DATU components. Frozen trajectory groups are removed, downstream offline reinforcement learning policies are trained, and paired final-checkpoint evaluation estimates empirical removal utility against baseline scores.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#315a7d" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f5eee3"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e7dc"/>
      <stop offset="1" stop-color="#efd4c8"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f1732"/>
      <stop offset="1" stop-color="#650d21"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f665f"/>
    </marker>
    <marker id="arrow-wine" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a1328"/>
    </marker>
  </defs>

  <rect width="1800" height="640" fill="#ffffff"/>
  <rect width="1800" height="640" fill="url(#grid)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="35" fill="#7a1328" font-family="Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.3">01 / SCORE OFFLINE TRAJECTORIES</text>

    <g>
      <rect x="40" y="58" width="245" height="184" rx="18" fill="url(#panel)" stroke="#cdb894" stroke-width="1.5"/>
      <rect x="62" y="78" width="89" height="24" rx="12" fill="#315a7d" fill-opacity="0.10"/>
      <text x="77" y="95" fill="#315a7d" font-family="Consolas, monospace" font-size="11" font-weight="700">DATASET</text>
      <text x="62" y="138" fill="#281f1a" font-size="25" font-weight="750">PointMaze offline data</text>
      <text x="62" y="174" fill="#66564b" font-size="17">D4RL medium-v2</text>
      <text x="62" y="205" fill="#725f52" font-family="Consolas, monospace" font-size="12">TRAJECTORIES + TRANSITIONS</text>
    </g>

    <line x1="285" y1="150" x2="326" y2="150" stroke="#6f665f" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="336" y="58" width="288" height="184" rx="18" fill="url(#panel)" stroke="#cdb894" stroke-width="1.5"/>
      <rect x="358" y="78" width="83" height="24" rx="12" fill="#7a1328" fill-opacity="0.08"/>
      <text x="373" y="95" fill="#7a1328" font-family="Consolas, monospace" font-size="11" font-weight="700">CONTROL</text>
      <text x="358" y="138" fill="#281f1a" font-size="25" font-weight="750">Matched conditions</text>
      <text x="358" y="174" fill="#66564b" font-size="17">Global statistics controlled</text>
      <text x="358" y="205" fill="#725f52" font-family="Consolas, monospace" font-size="12">CRITICAL SUPPORT VARIED</text>
    </g>

    <line x1="624" y1="150" x2="665" y2="150" stroke="#6f665f" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="675" y="58" width="268" height="184" rx="18" fill="url(#focus)" stroke="#b98240" stroke-width="1.5"/>
      <rect x="697" y="78" width="112" height="24" rx="12" fill="#7a1328" fill-opacity="0.09"/>
      <text x="712" y="95" fill="#7a1328" font-family="Consolas, monospace" font-size="11" font-weight="700">REFERENCE</text>
      <text x="697" y="138" fill="#281f1a" font-size="25" font-weight="750">Fixed IQL ensemble</text>
      <text x="697" y="174" fill="#66564b" font-size="17">Five bootstrapped critics</text>
      <text x="697" y="205" fill="#725f52" font-family="Consolas, monospace" font-size="12">OFFLINE OUTCOMES ONLY</text>
    </g>

    <line x1="943" y1="150" x2="984" y2="150" stroke="#7a1328" stroke-width="2" marker-end="url(#arrow-wine)"/>

    <g>
      <rect x="994" y="58" width="427" height="184" rx="18" fill="url(#panel)" stroke="#cdb894" stroke-width="1.5"/>
      <text x="1018" y="96" fill="#281f1a" font-size="24" font-weight="750">DATU component scores</text>
      <g font-family="Consolas, monospace" font-size="13" font-weight="700">
        <rect x="1018" y="116" width="118" height="74" rx="12" fill="#7a1328" fill-opacity="0.08" stroke="#7a1328" stroke-opacity="0.34"/>
        <text x="1034" y="146" fill="#7a1328">DECISION</text>
        <text x="1034" y="169" fill="#66564b" font-weight="400">sensitivity</text>
        <rect x="1148" y="116" width="126" height="74" rx="12" fill="#315a7d" fill-opacity="0.08" stroke="#315a7d" stroke-opacity="0.34"/>
        <text x="1164" y="146" fill="#315a7d">ENSEMBLE</text>
        <text x="1164" y="169" fill="#66564b" font-weight="400">uncertainty</text>
        <rect x="1286" y="116" width="113" height="74" rx="12" fill="#b37d35" fill-opacity="0.10" stroke="#b37d35" stroke-opacity="0.45"/>
        <text x="1302" y="146" fill="#8a5d24">LOCAL</text>
        <text x="1302" y="169" fill="#66564b" font-weight="400">support</text>
      </g>
      <text x="1018" y="218" fill="#725f52" font-family="Consolas, monospace" font-size="12">ROBUST NORMALIZE → PRODUCT → TOP-K MEAN</text>
    </g>

    <line x1="1421" y1="150" x2="1462" y2="150" stroke="#7a1328" stroke-width="2" marker-end="url(#arrow-wine)"/>

    <g>
      <rect x="1472" y="58" width="288" height="184" rx="18" fill="url(#result)"/>
      <rect x="1494" y="78" width="80" height="24" rx="12" fill="#ffffff" fill-opacity="0.14"/>
      <text x="1508" y="95" fill="#fff7ed" font-family="Consolas, monospace" font-size="11" font-weight="700">FROZEN</text>
      <text x="1494" y="138" fill="#ffffff" font-size="25" font-weight="750">Trajectory ranking</text>
      <text x="1494" y="174" fill="#f4dfe4" font-size="17">Top / bottom groups</text>
      <text x="1494" y="205" fill="#f1cbd4" font-family="Consolas, monospace" font-size="12">HASHED REMOVAL MANIFESTS</text>
    </g>

    <path d="M 1616 242 L 1616 286 L 184 286 L 184 350" fill="none" stroke="#7a1328" stroke-width="2" marker-end="url(#arrow-wine)"/>

    <text x="40" y="338" fill="#7a1328" font-family="Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.3">02 / ESTIMATE REMOVAL UTILITY</text>

    <g>
      <rect x="40" y="362" width="288" height="188" rx="18" fill="url(#panel)" stroke="#cdb894" stroke-width="1.5"/>
      <rect x="62" y="382" width="104" height="24" rx="12" fill="#315a7d" fill-opacity="0.10"/>
      <text x="77" y="399" fill="#315a7d" font-family="Consolas, monospace" font-size="11" font-weight="700">INTERVENE</text>
      <text x="62" y="442" fill="#281f1a" font-size="25" font-weight="750">Reference vs removal</text>
      <text x="62" y="478" fill="#66564b" font-size="17">D and D \ G</text>
      <text x="62" y="511" fill="#725f52" font-family="Consolas, monospace" font-size="12">40 / 180 TRAJECTORIES REMOVED</text>
    </g>

    <line x1="328" y1="456" x2="369" y2="456" stroke="#6f665f" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="379" y="362" width="384" height="188" rx="18" fill="url(#panel)" stroke="#cdb894" stroke-width="1.5"/>
      <text x="403" y="404" fill="#281f1a" font-size="25" font-weight="750">Train downstream policies</text>
      <g font-family="Consolas, monospace" font-size="13" font-weight="700">
        <rect x="403" y="426" width="72" height="40" rx="10" fill="#315a7d" fill-opacity="0.09"/><text x="429" y="451" fill="#315a7d">BC</text>
        <rect x="487" y="426" width="72" height="40" rx="10" fill="#7a1328" fill-opacity="0.08"/><text x="510" y="451" fill="#7a1328">IQL</text>
        <rect x="571" y="426" width="88" height="40" rx="10" fill="#b37d35" fill-opacity="0.11"/><text x="584" y="451" fill="#8a5d24">ReBRAC</text>
        <rect x="671" y="426" width="68" height="40" rx="10" fill="#315a7d" fill-opacity="0.09"/><text x="691" y="451" fill="#315a7d">CQL</text>
      </g>
      <text x="403" y="511" fill="#725f52" font-family="Consolas, monospace" font-size="12">FROZEN 86-JOB MATRIX · FINAL CHECKPOINTS</text>
    </g>

    <line x1="763" y1="456" x2="804" y2="456" stroke="#6f665f" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="814" y="362" width="328" height="188" rx="18" fill="url(#focus)" stroke="#b98240" stroke-width="1.5"/>
      <rect x="836" y="382" width="93" height="24" rx="12" fill="#7a1328" fill-opacity="0.09"/>
      <text x="851" y="399" fill="#7a1328" font-family="Consolas, monospace" font-size="11" font-weight="700">EVALUATE</text>
      <text x="836" y="442" fill="#281f1a" font-size="25" font-weight="750">Shared rollout panel</text>
      <text x="836" y="478" fill="#66564b" font-size="17">20 episodes · 250-step cap</text>
      <text x="836" y="511" fill="#725f52" font-family="Consolas, monospace" font-size="12">PAIRED TRAINING SEEDS</text>
    </g>

    <line x1="1142" y1="456" x2="1183" y2="456" stroke="#7a1328" stroke-width="2" marker-end="url(#arrow-wine)"/>

    <g>
      <rect x="1193" y="362" width="286" height="188" rx="18" fill="url(#panel)" stroke="#cdb894" stroke-width="1.5"/>
      <text x="1217" y="404" fill="#281f1a" font-size="25" font-weight="750">Empirical utility</text>
      <text x="1217" y="447" fill="#7a1328" font-family="Georgia, serif" font-size="26" font-style="italic">J(A,D) − J(A,D \ G)</text>
      <text x="1217" y="482" fill="#66564b" font-size="17">Paired effects + BCa interval</text>
      <text x="1217" y="511" fill="#725f52" font-family="Consolas, monospace" font-size="12">REMOVAL CHANGES POLICY SUCCESS</text>
    </g>

    <line x1="1479" y1="456" x2="1520" y2="456" stroke="#7a1328" stroke-width="2" marker-end="url(#arrow-wine)"/>

    <g>
      <rect x="1530" y="362" width="230" height="188" rx="18" fill="url(#result)"/>
      <text x="1552" y="407" fill="#ffffff" font-size="24" font-weight="750">Audit ranking</text>
      <text x="1552" y="447" fill="#f4dfe4" font-size="16">DATU · reward density</text>
      <text x="1552" y="478" fill="#f4dfe4" font-size="16">rarity · global coverage</text>
      <text x="1552" y="511" fill="#f1cbd4" font-family="Consolas, monospace" font-size="12">REPORT BOUNDARIES</text>
    </g>

    <line x1="40" y1="588" x2="1760" y2="588" stroke="#cdb894" stroke-width="1.4"/>
    <text x="40" y="618" fill="#725f52" font-family="Consolas, monospace" font-size="13">OFFLINE GROUP SELECTION</text>
    <circle cx="276" cy="613" r="4" fill="#7a1328"/>
    <text x="296" y="618" fill="#725f52" font-family="Consolas, monospace" font-size="13">HASHED EXPERIMENT CONTRACTS</text>
    <circle cx="604" cy="613" r="4" fill="#7a1328"/>
    <text x="624" y="618" fill="#725f52" font-family="Consolas, monospace" font-size="13">PAIRED EVALUATION</text>
    <circle cx="854" cy="613" r="4" fill="#7a1328"/>
    <text x="874" y="618" fill="#725f52" font-family="Consolas, monospace" font-size="13">ALGORITHM-DEPENDENT CONCLUSIONS</text>
  </g>
</svg>
